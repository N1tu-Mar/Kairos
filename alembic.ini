# Alembic configuration.
#
# The database URL is deliberately NOT set here. It comes from
# KAIROS_DB_URL at runtime (see migrations/env.py), because the deployed
# database lives on a mounted volume whose path only the container knows,
# and because a URL committed to a config file is a URL somebody eventually
# points at production by accident.

[alembic]
script_location = migrations
prepend_sys_path = .
# Filenames sort chronologically, so `ls` shows the real order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
